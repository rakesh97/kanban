[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban"
version = "0.1.0"
description = "Git-based project management for AI agents and humans"
requires-python = ">=3.8"

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]
